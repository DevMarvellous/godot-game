<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient (Obsidian to Vibrant Tropical Emerald) -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011611" />
    </radialGradient>

    <!-- Electric Gold & Neon Lime Rim Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- 3D Gold Extrusion Gradient -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Sunglasses Tint & Reflection -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Headphone Cushion Gradient -->
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle Base Card -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#neonRim)" stroke-width="8" filter="url(#badgeShadow)" />
  <rect x="32" y="32" width="448" height="448" rx="96" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2" />

  <!-- Radiating Campus Energy Rays -->
  <g opacity="0.15" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 12">
    <line x1="256" y1="230" x2="60" y2="60" />
    <line x1="256" y1="230" x2="452" y2="60" />
    <line x1="256" y1="230" x2="40" y2="230" />
    <line x1="256" y1="230" x2="472" y2="230" />
    <line x1="256" y1="230" x2="100" y2="380" />
    <line x1="256" y1="230" x2="412" y2="380" />
  </g>

  <!-- Tropical Palm Fronds -->
  <g opacity="0.25" stroke="#10b981" stroke-width="4" fill="none">
    <path d="M 40 280 C 70 240, 110 230, 150 250" />
    <path d="M 40 280 C 65 260, 95 260, 130 280" />
    <path d="M 472 280 C 442 240, 402 230, 362 250" />
    <path d="M 472 280 C 447 260, 417 260, 382 280" />
  </g>

  <!-- COOL CAMPUS STUDENT AVATAR (SHADES + HEADPHONES) -->
  <g transform="translate(0, -15)">
    <path d="M 172 170 C 172 90, 340 90, 340 170" fill="none" stroke="url(#headphoneGrad)" stroke-width="18" stroke-linecap="round" />
    <path d="M 176 170 C 176 98, 336 98, 336 170" fill="none" stroke="#fef08a" stroke-width="4" opacity="0.7" stroke-linecap="round" />

    <circle cx="256" cy="180" r="66" fill="#6e4632" stroke="#3d2419" stroke-width="4" />

    <path d="M 194 165 C 194 115, 318 115, 318 165 C 318 175, 194 175, 194 165 Z" fill="#171717" />
    <circle cx="215" cy="132" r="14" fill="#262626" />
    <circle cx="240" cy="124" r="16" fill="#262626" />
    <circle cx="272" cy="124" r="16" fill="#262626" />
    <circle cx="297" cy="132" r="14" fill="#262626" />

    <rect x="156" y="152" width="28" height="58" rx="14" fill="#0f172a" stroke="url(#headphoneGrad)" stroke-width="4" />
    <circle cx="170" cy="181" r="7" fill="#10b981" />
    <rect x="328" y="152" width="28" height="58" rx="14" fill="#0f172a" stroke="url(#headphoneGrad)" stroke-width="4" />
    <circle cx="342" cy="181" r="7" fill="#10b981" />

    <g filter="url(#badgeShadow)">
      <rect x="246" y="174" width="20" height="6" rx="2" fill="#f59e0b" />
      <path d="M 198 168 L 246 170 C 248 188, 244 204, 222 204 C 200 204, 196 188, 198 168 Z" fill="url(#lensGrad)" stroke="#f59e0b" stroke-width="4" />
      <path d="M 266 170 L 314 168 C 316 188, 312 204, 290 204 C 268 204, 264 188, 266 170 Z" fill="url(#lensGrad)" stroke="#f59e0b" stroke-width="4" />
      <line x1="206" y1="174" x2="218" y2="198" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
      <line x1="274" y1="174" x2="286" y2="198" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    </g>

    <path d="M 238 222 Q 256 236 274 222" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
    <circle cx="190" cy="204" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1.5" />
  </g>

  <!-- DYNAMIC 3D GAMING TYPOGRAPHY -->
  <g transform="translate(0, 260)">
    <rect x="206" y="0" width="100" height="32" rx="16" fill="#10b981" stroke="#fef08a" stroke-width="2.5" filter="url(#badgeShadow)" />
    <text x="256" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="4">MY</text>
  </g>

  <g transform="translate(256, 345)">
    <text x="0" y="6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#022c22" text-anchor="middle" letter-spacing="2">CAMPUS</text>
    <text x="0" y="4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#78350f" text-anchor="middle" letter-spacing="2">CAMPUS</text>
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#textGold)" stroke="#18181b" stroke-width="3" text-anchor="middle" letter-spacing="2">CAMPUS</text>
  </g>

  <g transform="translate(256, 415)">
    <text x="0" y="6" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="66" fill="#022c22" text-anchor="middle" letter-spacing="6">LIFE</text>
    <text x="0" y="4" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="66" fill="#047857" text-anchor="middle" letter-spacing="6">LIFE</text>
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="66" fill="#10b981" stroke="#fef08a" stroke-width="2.5" text-anchor="middle" letter-spacing="6">LIFE</text>
  </g>

  <g transform="translate(256, 462)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#fde047" text-anchor="middle" letter-spacing="3" opacity="0.95">★ 3D NAIJA SIMULATOR ★</text>
  </g>
</svg>
