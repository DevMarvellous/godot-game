      <text x="67" y="16" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#042f24">LIVE MULTIPLAYER</text>

      <rect x="142" y="0" width="138" height="24" rx="6" fill="#eab308" />
      <text x="211" y="16" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#422006">SUPABASE CLOUD</text>

      <rect x="288" y="0" width="144" height="24" rx="6" fill="#38bdf8" />
      <text x="360" y="16" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#0c4a6e">34 DEPARTMENTS</text>
    </g>
