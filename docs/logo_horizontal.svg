<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <radialGradient id="hBgGlow" cx="20%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="55%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021f18" />
    </radialGradient>
    <linearGradient id="hGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="hMetallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="944" height="244" rx="36" fill="url(#hBgGlow)" stroke="url(#hGoldRim)" stroke-width="4" filter="url(#hShadow)" />

  <!-- Left Icon Emblem (Scale 0.44 placed at x: 26, y: 16) -->
  <g transform="translate(34, 18) scale(0.44)">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#042f24" stroke="url(#hGoldRim)" stroke-width="8" />
    <!-- Mortarboard Cap -->
    <polygon points="256,105 396,165 256,225 116,165" fill="#1e293b" stroke="#64748b" stroke-width="3" />
    <ellipse cx="256" cy="165" rx="14" ry="9" fill="url(#hMetallicGold)" />
    <path d="M256 165 C220 170, 175 195, 168 235 L164 275" fill="none" stroke="url(#hGoldRim)" stroke-width="6" />
    <!-- Gold Naira Sign -->
    <g transform="translate(256, 310)" fill="url(#hMetallicGold)" stroke="#fef08a" stroke-width="2">
      <rect x="-56" y="-60" width="22" height="110" rx="6" />
      <rect x="34" y="-60" width="22" height="110" rx="6" />
      <polygon points="-48,-50 -32,-50 48,38 32,38" />
      <rect x="-70" y="-22" width="140" height="14" rx="4" />
      <rect x="-70" y="8" width="140" height="14" rx="4" />
    </g>
  </g>

  <!-- Typography Right Section -->
  <g transform="translate(285, 0)">
    <!-- Sub-tagline pill -->
    <rect x="0" y="44" width="220" height="28" rx="14" fill="rgba(245,197,24,0.15)" stroke="rgba(245,197,24,0.5)" stroke-width="1.5" />
    <text x="110" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle" fill="#fde047">
      🇳🇬 NIGERIAN CAMPUS LIFE-SIM
    </text>

    <!-- Main Title: MY CAMPUS LIFE -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Impact', sans-serif" font-size="58" font-weight="900" letter-spacing="3" fill="url(#hMetallicGold)" filter="url(#hShadow)">
      MY CAMPUS LIFE
    </text>

    <!-- Subtitle description -->
    <text x="2" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">
      Lectures • Danfo Shuttles • Hostel Living • Mama Put • CampusPay Hustles
    </text>

    <!-- Tag badges -->
    <g transform="translate(2, 196)">
      <rect x="0" y="0" width="128" height="24" rx="6" fill="#10b981" />
      <text x="64" y="16" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#042f24">LIVE MULTIPLAYER</text>

      <rect x="136" y="0" width="138" height="24" rx="6" fill="#eab308" />
      <text x="205" y="16" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#422006">SUPABASE CLOUD</text>

      <rect x="282" y="0" width="144" height="24" rx="6" fill="#38bdf8" />
      <text x="354" y="16" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#0c4a6e">34 DEPARTMENTS</text>
    </g>
  </g>
</svg>

