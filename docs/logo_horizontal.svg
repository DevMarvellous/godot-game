      <path d="M125 335 C125 365, 145 405, 195 422 C185 407, 180 382, 186 362 C168 377, 142 372, 133 352 Z" />
      <path d="M106 288 C100 318, 116 348, 146 362 C141 346, 141 326, 151 311 C131 321, 116 312, 111 297 Z" />
      <path d="M387 335 C387 365, 367 405, 317 422 C327 407, 332 382, 326 362 C344 377, 370 372, 379 352 Z" />
      <path d="M406 288 C412 318, 396 348, 366 362 C371 346, 371 326, 361 311 C381 321, 396 312, 401 297 Z" />
    </g>
  </g>

  <!-- Typography Right Section -->
  <g transform="translate(285, 0)">
    <!-- Sub-tagline pill -->
    <rect x="0" y="44" width="260" height="28" rx="14" fill="rgba(245,197,24,0.15)" stroke="rgba(245,197,24,0.5)" stroke-width="1.5" />
    <text x="130" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle" fill="#fde047">
