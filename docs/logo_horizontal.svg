<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <radialGradient id="hBgGlow" cx="20%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="55%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#021f18" />
    </radialGradient>
    <linearGradient id="hGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
