    <ellipse cx="256" cy="122" rx="14" ry="9" fill="url(#hMetallicGold)" />
    <path d="M256 122 C220 128, 172 152, 164 192 L160 234" fill="none" stroke="url(#hGoldRim)" stroke-width="6" />
    <!-- Book of knowledge -->
    <path d="M148 270 Q205 255 254 265 L254 340 Q205 330 146 345 Z" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <path d="M364 270 Q307 255 258 265 L258 340 Q307 330 366 345 Z" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <!-- Gold Naira Sign -->
    <g transform="translate(256, 305)" fill="url(#hMetallicGold)" stroke="#fef08a" stroke-width="2">
      <rect x="-44" y="-48" width="18" height="88" rx="5" />
      <rect x="26" y="-48" width="18" height="88" rx="5" />
      <polygon points="-38,-40 -25,-40 38,30 25,30" />
      <rect x="-56" y="-18" width="112" height="11" rx="3.5" />
      <rect x="-56" y="6" width="112" height="11" rx="3.5" />
    </g>
