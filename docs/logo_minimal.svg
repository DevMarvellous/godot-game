<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="85%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011a14" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="metallicGold" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="capTopGrad" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="9" filter="url(#softShadow)" />
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="rgba(254, 240, 138, 0.25)" stroke-width="2.5" />

  <!-- Academic Gold Laurel Leaves -->
  <g fill="url(#metallicGold)" opacity="0.95" filter="url(#softShadow)">
    <path d="M125 345 C125 385, 150 425, 205 442 C195 427, 190 398, 196 374 C175 390, 142 384, 133 362 Z" />
    <path d="M106 295 C100 328, 118 360, 150 374 C145 356, 145 334, 156 318 C134 328, 118 318, 111 303 Z" />
    <path d="M104 238 C98 266, 114 296, 142 308 C140 290, 147 272, 158 260 C136 266, 118 254, 110 242 Z" />

    <path d="M387 345 C387 385, 362 425, 307 442 C317 427, 322 398, 316 374 C337 390, 370 384, 379 362 Z" />
    <path d="M406 295 C412 328, 394 360, 362 374 C367 356, 367 334, 356 318 C378 328, 394 318, 401 303 Z" />
    <path d="M408 238 C414 266, 398 296, 370 308 C372 290, 365 272, 354 260 C376 266, 394 254, 402 242 Z" />
  </g>

  <!-- Open Book of Knowledge -->
  <g filter="url(#softShadow)" transform="translate(0, 195)">
    <path d="M142 145 Q256 175 370 145 L375 162 Q256 192 137 162 Z" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <path d="M145 88 Q205 72 254 82 L254 158 Q205 148 143 162 Z" fill="url(#parchmentGrad)" stroke="#d97706" stroke-width="1.5" />
    <path d="M367 88 Q307 72 258 82 L258 158 Q307 148 369 162 Z" fill="url(#parchmentGrad)" stroke="#d97706" stroke-width="1.5" />
    <polygon points="253,80 259,80 259,178 253,178" fill="url(#metallicGold)" />
  </g>

  <!-- Gleaming 3D Metallic Gold NAIRA (₦) Sign -->
  <g filter="url(#goldGlow)" transform="translate(256, 308)">
    <g fill="#713f12" transform="translate(2.5, 3.5)">
      <rect x="-46" y="-50" width="19" height="92" rx="5" />
      <rect x="27" y="-50" width="19" height="92" rx="5" />
      <polygon points="-38,-42 -24,-42 38,32 24,32" />
      <rect x="-58" y="-19" width="116" height="12" rx="4" />
      <rect x="-58" y="7" width="116" height="12" rx="4" />
    </g>
    <g fill="url(#metallicGold)" stroke="#fef08a" stroke-width="1.5">
      <rect x="-46" y="-50" width="19" height="92" rx="5" />
      <rect x="27" y="-50" width="19" height="92" rx="5" />
      <polygon points="-40,-42 -26,-42 40,32 26,32" />
      <rect x="-58" y="-19" width="116" height="12" rx="4" />
      <rect x="-58" y="7" width="116" height="12" rx="4" />
    </g>
    <polygon points="48,-54 52,-42 64,-40 54,-30 57,-18 46,-26 35,-18 38,-30 28,-40 40,-42" fill="#ffffff" filter="url(#goldGlow)" />
  </g>

  <!-- 3D Mortarboard Cap -->
  <g filter="url(#softShadow)">
    <path d="M188 136 Q256 172 324 136 L324 164 Q256 200 188 164 Z" fill="#0f172a" stroke="#020617" stroke-width="2" />
    <polygon points="256,52 404,110 256,168 108,110" fill="url(#capTopGrad)" stroke="#64748b" stroke-width="2.5" />
    <polygon points="256,60 392,110 256,160 120,110" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <ellipse cx="256, 110" rx="14" ry="9" fill="url(#metallicGold)" stroke="#78350f" stroke-width="1.5" />
    <path d="M256 110 C218 116, 168 140, 160 180 L156 222" fill="none" stroke="url(#goldRim)" stroke-width="6" stroke-linecap="round" />
    <path d="M156 222 L148 262 Q156 270 164 262 L158 222 Z" fill="url(#metallicGold)" stroke="#92400e" stroke-width="1" />
  </g>
</svg>
