<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <radialGradient id="hBgGlow" cx="20%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011611" />
    </radialGradient>
    <linearGradient id="hNeonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="hTextGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="hHeadphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="hLensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="944" height="244" rx="36" fill="url(#hBgGlow)" stroke="url(#hNeonRim)" stroke-width="4" filter="url(#hShadow)" />

  <!-- Left Icon Emblem (Student Avatar with Headphones & Shades) -->
  <g transform="translate(36, 16) scale(0.44)">
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#022c22" stroke="url(#hNeonRim)" stroke-width="8" />
    <!-- Headphone Arc -->
    <path d="M 172 170 C 172 90, 340 90, 340 170" fill="none" stroke="url(#hHeadphoneGrad)" stroke-width="18" stroke-linecap="round" />
    <!-- Face Silhouette -->
    <circle cx="256" cy="180" r="66" fill="#6e4632" stroke="#3d2419" stroke-width="4" />
    <!-- Afro-Fade -->
    <path d="M 194 165 C 194 115, 318 115, 318 165 Z" fill="#171717" />
    <!-- Headphone Cups -->
    <rect x="156" y="152" width="28" height="58" rx="14" fill="#0f172a" stroke="url(#hHeadphoneGrad)" stroke-width="4" />
    <rect x="328" y="152" width="28" height="58" rx="14" fill="#0f172a" stroke="url(#hHeadphoneGrad)" stroke-width="4" />
    <!-- Sunglasses -->
    <rect x="246" y="174" width="20" height="6" rx="2" fill="#f59e0b" />
    <path d="M 198 168 L 246 170 C 248 188, 244 204, 222 204 C 200 204, 196 188, 198 168 Z" fill="url(#hLensGrad)" stroke="#f59e0b" stroke-width="4" />
    <path d="M 266 170 L 314 168 C 316 188, 312 204, 290 204 C 268 204, 264 188, 266 170 Z" fill="url(#hLensGrad)" stroke="#f59e0b" stroke-width="4" />
    <path d="M 238 222 Q 256 236 274 222" fill="none" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
    <!-- Mini Typography on Badge -->
    <text x="256" y="380" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="url(#hTextGold)" text-anchor="middle">MCL</text>
  </g>

  <!-- Typography Right Section -->
  <g transform="translate(280, 52)">
    <!-- Pill Badge: NAIJA 3D SIMULATOR -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#10b981" stroke="#fef08a" stroke-width="2" />
    <text x="110" y="19" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="3">★ 3D NAIJA SIMULATOR ★</text>

    <!-- Main Title: MY CAMPUS LIFE -->
    <g transform="translate(0, 78)">
      <text x="0" y="4" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#022c22" letter-spacing="2">MY CAMPUS LIFE</text>
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="url(#hTextGold)" stroke="#18181b" stroke-width="2" letter-spacing="2">MY CAMPUS LIFE</text>
    </g>

    <!-- Subtitle: University Life, Gigs & Banter -->
    <text x="2" y="128" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#a7f3d0" letter-spacing="1">Hostels • Mama Put • Danfo Shuttles • Gigs • Snooker • Sports</text>
  </g>
</svg>
